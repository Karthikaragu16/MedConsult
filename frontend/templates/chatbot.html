<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedBot - AI Health Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background: var(--background); }
        .chat-page { max-width: 800px; margin: 0 auto; padding: 2rem 1rem; }
        .chat-header-bar { display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem; }
        .bot-avatar { width: 50px; height: 50px; background: linear-gradient(135deg, var(--primary), var(--btn-hover)); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 1.5rem; box-shadow: 0 4px 14px rgba(77,166,255,0.35); }
        .chat-container { background: var(--surface); border-radius: var(--radius-lg); border: 1.5px solid var(--border); box-shadow: var(--shadow); height: 500px; display: flex; flex-direction: column; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; background: var(--background); border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
        .msg { max-width: 75%; padding: 0.875rem 1.25rem; border-radius: 1.25rem; font-size: 0.9rem; line-height: 1.5; }
        .msg.user { background: var(--btn-color); color: white; align-self: flex-end; border-bottom-right-radius: 0.25rem; box-shadow: 0 2px 8px rgba(51,153,255,0.25); }
        .msg.bot  { background: var(--surface); color: var(--text); align-self: flex-start; border-bottom-left-radius: 0.25rem; border: 1px solid var(--border); }
        .chat-input-bar { padding: 1rem; border-top: 1.5px solid var(--border); display: flex; gap: 0.75rem; background: var(--surface); border-radius: 0 0 var(--radius-lg) var(--radius-lg); }
        .chat-input-bar input { flex: 1; background: var(--background); border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 0.75rem 1rem; color: var(--text); font-size: 0.9rem; outline: none; font-family: 'Inter', sans-serif; transition: var(--transition); }
        .chat-input-bar input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(77,166,255,0.12); }
        .chat-input-bar input::placeholder { color: var(--text-light); }
        .send-btn { background: var(--btn-color); border: none; border-radius: var(--radius-sm); padding: 0.75rem 1.25rem; color: white; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; font-weight: 600; transition: var(--transition); }
        .send-btn:hover { background: var(--btn-hover); transform: translateY(-1px); }
        .quick-btns { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
        .quick-btn { background: var(--surface); border: 1.5px solid var(--border); border-radius: 2rem; padding: 0.4rem 1rem; color: var(--text-muted); font-size: 0.8rem; cursor: pointer; transition: var(--transition); font-family: 'Inter', sans-serif; }
        .quick-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }
        .back-btn { color: var(--text-muted); text-decoration: none; display: flex; align-items: center; gap: 0.5rem; font-size: 0.875rem; font-weight: 500; }
        .back-btn:hover { color: var(--primary); }
    </style>
</head>
<body>
    <div class="chat-page">
        <a href="/dashboard" class="back-btn" style="margin-bottom: 1rem; display: inline-flex;">
            <i data-lucide="arrow-left" style="width:16px;"></i> Back to Dashboard
        </a>

        <div class="chat-header-bar">
            <div class="bot-avatar">🤖</div>
            <div>
                <h2 style="color: var(--text); margin: 0;">MedBot</h2>
                <p style="color: var(--text-muted); margin: 0; font-size: 0.875rem;">AI Health Assistant • Online</p>
            </div>
        </div>

        <div class="quick-btns">
            <button class="quick-btn" onclick="sendQuick('I have a fever')">🌡️ Fever</button>
            <button class="quick-btn" onclick="sendQuick('I have chest pain')">❤️ Chest Pain</button>
            <button class="quick-btn" onclick="sendQuick('I have a headache')">🧠 Headache</button>
            <button class="quick-btn" onclick="sendQuick('I have stomach pain')">🤢 Stomach Pain</button>
            <button class="quick-btn" onclick="sendQuick('I have a cough')">😷 Cough</button>
        </div>

        <div class="chat-container">
            <div class="chat-messages" id="chat-messages">
                <div class="msg bot">👋 Hello! I am MedBot, your AI Health Assistant.<br><br>Please describe your symptoms and I will help you find the right doctor to consult.</div>
            </div>
            <div class="chat-input-bar">
                <input type="text" id="chat-input" placeholder="Type your symptoms here..." onkeypress="if(event.key==='Enter') sendMessage()">
                <button class="send-btn" onclick="sendMessage()">
                    <i data-lucide="send" style="width:16px;"></i> Send
                </button>
            </div>
        </div>
    </div>

    <script>
        const responses = {
            'fever': '🌡️ **Possible Condition: Viral Fever (85%) / Flu (60%)**\n\n✅ Do\'s: Stay hydrated, rest well, monitor temperature.\n❌ Don\'ts: Avoid cold drinks, heavy exercise.\n🏠 Home Remedy: Ginger tea with honey.\n\n👨‍⚕️ Recommended: Visit a **General Physician** if fever exceeds 102°F.',
            'headache': '🧠 **Possible Condition: Migraine (75%) / Tension Headache (60%)**\n\n✅ Do\'s: Rest in a dark room, stay hydrated.\n❌ Don\'ts: Avoid bright screens.\n🏠 Home Remedy: Peppermint oil on temples.\n\n👨‍⚕️ Recommended: Visit a **Neurologist** if persistent.',
            'chest pain': '🚨 **EMERGENCY ALERT!**\n\nChest pain may indicate a serious cardiac condition.\n\n⚠️ Please seek **IMMEDIATE medical attention** or call emergency services!\n\n👨‍⚕️ Recommended: **Cardiologist / Emergency Room**',
            'cough': '😷 **Possible Condition: Common Cold (80%) / Bronchitis (40%)**\n\n✅ Do\'s: Warm salt water gargle, steam inhalation.\n❌ Don\'ts: Avoid cold air and dairy.\n🏠 Home Remedy: Honey + ginger + tulsi tea.\n\n👨‍⚕️ Recommended: **General Physician**',
            'stomach pain': '🤢 **Possible Condition: Gastritis (70%) / Indigestion (60%)**\n\n✅ Do\'s: Eat light, drink warm water.\n❌ Don\'ts: Avoid spicy and oily food.\n🏠 Home Remedy: Jeera (cumin) water.\n\n👨‍⚕️ Recommended: **Gastroenterologist**',
        };

        function sendQuick(text) {
            document.getElementById('chat-input').value = text;
            sendMessage();
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            addMsg(text, 'user');
            input.value = '';

            setTimeout(() => {
                let reply = '🤔 I understand your concern. Based on your symptoms, I recommend consulting a **General Physician** for a proper evaluation.\n\n💊 In the meantime, rest well and stay hydrated.';
                const lower = text.toLowerCase();
                for (const key in responses) {
                    if (lower.includes(key)) { reply = responses[key]; break; }
                }
                addMsg(reply.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>'), 'bot', true);
            }, 800);
        }

        function addMsg(text, type, isHtml = false) {
            const div = document.createElement('div');
            div.className = `msg ${type}`;
            if (isHtml) div.innerHTML = text;
            else div.textContent = text;
            const messages = document.getElementById('chat-messages');
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        lucide.createIcons();
    </script>
</body>
</html>
